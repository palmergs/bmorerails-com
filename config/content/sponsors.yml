# Fields: name (required), url, tier (partner | supporter | friend), blurb,
#         logo (filename in app/assets/images/sponsors/, optional)
#
# Tiers drive display order and card size — a partner gets the full-width
# card at the top of the section.
#
# Deleting an entry is safe. Deleting all of them is also safe: the section
# falls back to just the "become a sponsor" call to action.

# CONFIRMED CURRENT. EcoMap provides the space for the monthly meetup, per
# the sponsor credit on the Luma event listings.
- name: "EcoMap"
  url: "https://www.ecomap.tech"
  tier: partner
  blurb: >
    Provides the space for our monthly meetup at Miller's Court. EcoMap
    builds ecosystem intelligence tools for economic developers.
  logo: "ecomap.png"

